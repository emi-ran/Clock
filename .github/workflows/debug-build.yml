name: Debug build and tests
on:
  push:
    branches: [feature/alarm-challenges]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check hosted Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/debug/Clock_2.34-debug.apk artifact/Clock_2.34-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging artifact/Clock_2.34-debug.apk | tee artifact/metadata.txt
          grep -F "package: name='com.best.deskclock.debug' versionCode='2038' versionName='2.34-debug'" artifact/metadata.txt
          (cd artifact && sha256sum Clock_2.34-debug.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: clock-debug-apk
          path: artifact/
          if-no-files-found: error
